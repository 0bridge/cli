# Publishes apps/cli to npm when a v* tag is pushed, with provenance. Uses npm trusted
# publishing (OIDC): no token is stored here. On npmjs.com → the 0bridge package → Settings →
# Trusted publishing, add GitHub Actions: organization 0bridge, repository cli, workflow publish.yml.
name: Publish
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - name: No secrets in the tree
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner
      - uses: oven-sh/setup-bun@v2
      # No registry-url: setup-node would write an .npmrc with a placeholder token, and publishing
      # here authenticates with GitHub's OIDC token instead (npm 11.5.1 or newer).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: The tag matches the package version
        run: test "v$(node -p "require('./apps/cli/package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public --loglevel verbose
        working-directory: apps/cli
